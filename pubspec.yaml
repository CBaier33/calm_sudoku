name: sudoku
description: "An implementation of sudoku, designed for e-ink displays."

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^8.1.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  image_path: "assets/sudoku_icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/sudoku_splash.png"
  fullscreen: true
  android_12:
    color: "#FFFFFF"
    image: "assets/sudoku_splash.png"
    icon_background_color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/
